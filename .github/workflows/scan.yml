name: Solana Wallet Fingerprint Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Solana public key tools
        run: npm install --no-save --no-package-lock @solana/web3.js@1

      - name: Identify EMBER candidate tokens
        run: node identify-ember.js

      - name: Upload metadata results (including partial results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-identification
          path: |
            ember-identified.json
            ember-name-matches.json
            ember-identification-status.json
          if-no-files-found: warn
