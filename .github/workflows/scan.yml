name: Solana Wallet Fingerprint Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    # Plenty of room for highly active wallets.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Helius wallet scanner
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scanner.js

      - name: Upload EMBER reverse scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-reverse-scan
          path: |
            ember-reverse-results.json
            ember-reverse-summary.json
            ember-reverse-candidates.json
          if-no-files-found: warn
          retention-days: 7
