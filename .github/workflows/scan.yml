name: Solana Wallet Fingerprint Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    # Plenty of room for highly active wallets.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Identify EMBER tokens
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node identify-ember.js
      
      - name: Verify output files
        if: always()
        run: |
          echo "Repository files:"
          ls -lah
          echo "Expected output files:"
          ls -lh ember-identified.json ember-name-matches.json
      
      - name: Upload EMBER identification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-identification
          path: |
            ember-identified.json
            ember-name-matches.json
          if-no-files-found: error
