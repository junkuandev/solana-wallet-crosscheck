name: Bitquery Low-Credit Probe
on:
  workflow_dispatch:
    inputs:
      mint:
        description: "Test mint address"
        required: true
        default: "Ca5VuKu5NyyFkixnewTnokmzXpmNuG8Mk5odwHJypRNq"
        type: string
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Bitquery archival trades (max 5)
        env:
          BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
          TEST_MINT: ${{ inputs.mint }}
        run: node bitquery-probe.js
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitquery-probe
          path: bitquery-probe.json
          if-no-files-found: warn
