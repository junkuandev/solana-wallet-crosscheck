name: Tech Catch Five Token Crosscheck
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Scan tech-catch preset tokens
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: node tech-catch-five-token-crosscheck.js
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-catch-five-token-crosscheck
          path: tech-catch-five-token-crosscheck.json
          if-no-files-found: warn
