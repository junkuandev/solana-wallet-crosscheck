name: Fomi Ai Wallet Cross-check
on:
  workflow_dispatch:
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Cross-check Fomi Ai wallet activity
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: node fomi-crosscheck.js
      - name: Upload cross-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fomi-crosscheck
          path: fomi-crosscheck.json
          if-no-files-found: warn
