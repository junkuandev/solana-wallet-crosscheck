name: Vol-Tight Targeted Wallet Scan
on:
  workflow_dispatch:
    inputs:
      max_pages_per_window:
        description: "Max API requests per time window (1-20)"
        required: true
        default: "4"
        type: string
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Fetch entry and exit windows
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
          MAX_PAGES_PER_WINDOW: ${{ inputs.max_pages_per_window }}
        run: node vol-tight-targeted-scan.js
      - name: Upload raw trades and candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vol-tight-targeted-results
          path: |
            vol-tight-raw-trades.json
            vol-tight-candidates.json
          if-no-files-found: warn
