name: Pairstreet Wallet Verification
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Fetch three wallet-specific histories
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: node pairstreet-wallet-verification.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairstreet-wallet-verification
          path: pairstreet-wallet-verification.json
          if-no-files-found: warn
