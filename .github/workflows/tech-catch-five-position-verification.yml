name: Tech Catch Five Position Verification
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Verify complete positions for five tech-catch trades
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: node tech-catch-five-position-verification.js
      - name: Upload verification JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-catch-five-position-verification
          path: tech-catch-five-position-verification.json
          if-no-files-found: warn
