name: Fomi Single Wallet Retry
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Retry outstanding Fomi query
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: node fomi-single-wallet-retry.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fomi-single-wallet-retry
          path: fomi-single-wallet-retry.json
