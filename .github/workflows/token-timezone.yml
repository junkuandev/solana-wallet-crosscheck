name: Token Launch Timezone Analysis
on:
  workflow_dispatch:
    inputs:
      mint:
        description: "Full Solana mint"
        required: true
        default: "6iQp3cxTYPKaHHRX3SnmuFisLdrr9DznDU6gKnQtpump"
        type: string
      display_time:
        description: "Screenshot time YYYY-MM-DDTHH:MM"
        required: true
        default: "2026-10-05T08:21"
        type: string
      hold_minutes:
        description: "Screenshot hold minutes"
        required: true
        default: "1"
        type: string
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find token creation reference and compare timezones
        env:
          MINT: ${{ inputs.mint }}
          DISPLAY_TIME: ${{ inputs.display_time }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: node token-timezone.js
      - name: Upload timezone results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-timezone-results
          path: token-timezone-results.json
          if-no-files-found: warn
