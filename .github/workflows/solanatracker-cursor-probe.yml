name: Solana Tracker Cursor Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @solana-tracker/data-api@0.5.0
      - name: Test timestamp cursor near Charizard entry
        env:
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: node solanatracker-cursor-probe.js
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solanatracker-cursor-probe
          path: solanatracker-cursor-probe.json
          if-no-files-found: warn
